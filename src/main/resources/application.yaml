server:
  port: 8081

spring:
  application:
    name: plaza-orders
  # Las credenciales de la base salen de Vault: el secreto trae DB_URL, DB_USERNAME y DB_PASSWORD.
  # La dirección y el token de Vault llegan por VAULT_ADDR y VAULT_TOKEN.
  config:
    import: nova-secrets:vault:plaza/orders/db
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoint:
    health:
      probes:
        enabled: true

nova:
  # La clave de idempotencia de una compra vale por cliente, y el cliente llega del BFF en este header.
  idempotency:
    scope-header: X-Customer-Id
  observability:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
